<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор сайтов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1e2e;
    color: #e0e0e0;
    overflow: hidden;
  }

  /* ====== Общий layout ====== */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr 280px;
    grid-template-rows: 52px 1fr;
    height: 100vh;
  }

  /* ====== Шапка ====== */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: #181825;
    border-bottom: 1px solid #313244;
  }
  .topbar .logo {
    font-weight: 700;
    color: #89b4fa;
    margin-right: auto;
  }
  .btn {
    padding: 7px 14px;
    border: 1px solid #45475a;
    background: #313244;
    color: #cdd6f4;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .btn:hover { background: #45475a; }
  .btn.primary {
    background: #89b4fa;
    color: #1e1e2e;
    border-color: #89b4fa;
    font-weight: 600;
  }
  .btn.primary:hover { background: #74a8f0; }
  .btn.danger { color: #f38ba8; border-color: #f38ba8; }
  .btn.danger:hover { background: #f38ba8; color: #1e1e2e; }

  /* ====== Левая панель — блоки ====== */
  .sidebar-left {
    background: #181825;
    border-right: 1px solid #313244;
    padding: 12px;
    overflow-y: auto;
  }
  .panel-title {
    font-size: 11px;
    text-transform: uppercase;
    color: #7f849c;
    letter-spacing: 0.6px;
    margin: 8px 4px 10px;
  }
  .block-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #313244;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: grab;
    font-size: 13px;
    transition: all 0.15s;
    user-select: none;
  }
  .block-item:hover {
    background: #45475a;
    transform: translateX(2px);
  }
  .block-item:active { cursor: grabbing; }
  .block-item .icon { font-size: 16px; }

  /* ====== Центр — холст ====== */
  .canvas-wrap {
    background: #11111b;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .canvas {
    background: #fff;
    color: #000;
    width: 100%;
    max-width: 900px;
    min-height: calc(100vh - 100px);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }
  .canvas.empty::before {
    content: "Перетащите блок сюда или кликните по элементу слева";
    display: block;
    padding: 80px 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
  }

  /* Блоки на холсте */
  .canvas .block {
    position: relative;
    padding: 16px 24px;
    transition: outline 0.1s;
    cursor: pointer;
  }
  .canvas .block:hover {
    outline: 2px dashed #89b4fa;
    outline-offset: -2px;
  }
  .canvas .block.selected {
    outline: 2px solid #89b4fa;
    outline-offset: -2px;
  }
  .canvas .block.dragover {
    border-top: 3px solid #89b4fa;
    margin-top: -3px;
  }

  /* Кнопки управления блоком (появляются при наведении) */
  .block-actions {
    position: absolute;
    top: 4px;
    right: 4px;
    display: none;
    gap: 4px;
    z-index: 10;
  }
  .block:hover .block-actions { display: flex; }
  .block-actions button {
    width: 26px; height: 26px;
    border: none;
    background: #89b4fa;
    color: #1e1e2e;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .block-actions button:hover { background: #74a8f0; }
  .block-actions button.del { background: #f38ba8; }
  .block-actions button.del:hover { background: #e07a97; }

  /* Drag handle */
  .drag-handle {
    position: absolute;
    top: 4px; left: 4px;
    width: 26px; height: 26px;
    background: #89b4fa;
    color: #1e1e2e;
    border-radius: 5px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: grab;
    font-size: 13px;
    z-index: 10;
  }
  .block:hover .drag-handle { display: flex; }
  .drag-handle:active { cursor: grabbing; }

  /* Стили блоков на холсте */
  .block h1 { font-size: 36px; margin: 0; }
  .block h2 { font-size: 26px; margin: 0; }
  .block p { font-size: 16px; line-height: 1.5; margin: 0; }
  .block img { max-width: 100%; height: auto; display: block; }
  .block .btn-block {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
  }
  .block .divider {
    height: 2px;
    background: #ddd;
    margin: 0;
  }
  .block .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .block .col { padding: 8px; }
  .block .video-wrap {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 6px;
  }
  .block .video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .block .form-row { margin-bottom: 12px; }
  .block .form-row label {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    color: #444;
  }
  .block .form-row input,
  .block .form-row textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .block .form-btn {
    padding: 12px 28px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ====== Правая панель — свойства ====== */
  .sidebar-right {
    background: #181825;
    border-left: 1px solid #313244;
    padding: 12px;
    overflow-y: auto;
  }
  .sidebar-right.empty::before {
    content: "Выберите блок на холсте, чтобы редактировать свойства";
    display: block;
    padding: 20px;
    color: #6c7086;
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
  }
  .prop-group { margin-bottom: 14px; }
  .prop-group label {
    display: block;
    font-size: 11px;
    color: #7f849c;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }
  .prop-group input[type="text"],
  .prop-group input[type="number"],
  .prop-group input[type="url"],
  .prop-group textarea,
  .prop-group select {
    width: 100%;
    padding: 8px 10px;
    background: #313244;
    border: 1px solid #45475a;
    color: #cdd6f4;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .prop-group textarea { resize: vertical; min-height: 70px; }
  .prop-group input[type="color"] {
    width: 100%;
    height: 34px;
    background: transparent;
    border: 1px solid #45475a;
    border-radius: 6px;
    cursor: pointer;
    padding: 2px;
  }
  .prop-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* ====== Модалка превью ====== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    z-index: 1000;
    padding: 20px;
  }
  .modal.open { display: flex; flex-direction: column; }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #181825;
    border-radius: 8px 8px 0 0;
    border-bottom: 1px solid #313244;
  }
  .modal-body {
    flex: 1;
    background: #fff;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
  }
  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ====== Уведомление ====== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #a6e3a1;
    color: #1e1e2e;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transition: transform 0.3s;
    z-index: 2000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Мобильная адаптация редактора */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 52px auto 1fr auto; }
    .sidebar-left { max-height: 160px; }
    .sidebar-right { max-height: 240px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="logo">🧱 Конструктор сайтов</div>
    <button class="btn" id="btnPreview">👁 Превью</button>
    <button class="btn" id="btnClear">🗑 Очистить</button>
    <button class="btn primary" id="btnExport">⬇ Скачать HTML</button>
  </div>

  <!-- Left sidebar -->
  <aside class="sidebar-left">
    <div class="panel-title">Блоки</div>
    <div class="block-item" draggable="true" data-type="heading"><span class="icon">🅷</span> Заголовок</div>
    <div class="block-item" draggable="true" data-type="text"><span class="icon">📝</span> Текст</div>
    <div class="block-item" draggable="true" data-type="image"><span class="icon">🖼</span> Картинка</div>
    <div class="block-item" draggable="true" data-type="button"><span class="icon">🔘</span> Кнопка</div>
    <div class="block-item" draggable="true" data-type="divider"><span class="icon">➖</span> Разделитель</div>
    <div class="block-item" draggable="true" data-type="columns"><span class="icon">▥</span> Колонки</div>
    <div class="block-item" draggable="true" data-type="video"><span class="icon">▶</span> Видео</div>
    <div class="block-item" draggable="true" data-type="form"><span class="icon">✉</span> Форма</div>
  </aside>

  <!-- Canvas -->
  <div class="canvas-wrap">
    <div class="canvas empty" id="canvas"></div>
  </div>

  <!-- Right sidebar -->
  <aside class="sidebar-right empty" id="props"></aside>
</div>

<!-- Preview modal -->
<div class="modal" id="modal">
  <div class="modal-head">
    <strong style="font-size:13px">Предпросмотр</strong>
    <button class="btn" id="btnClosePreview">✕ Закрыть</button>
  </div>
  <div class="modal-body">
    <iframe id="previewFrame"></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================================================================
// ДАННЫЕ
// ================================================================
let blocks = [];          // массив объектов блоков
let selectedId = null;    // id выбранного блока
let blockCounter = 0;

const canvas = document.getElementById('canvas');
const props = document.getElementById('props');

// ================================================================
// ФАБРИКА БЛОКОВ — значения по умолчанию
// ================================================================
function createBlock(type) {
  const id = ++blockCounter;
  const base = { id, type };

  switch (type) {
    case 'heading':
      return { ...base, text: 'Заголовок', level: 1,
               color: '#111111', align: 'left', padding: 16 };

    case 'text':
      return { ...base, text: 'Это обычный текстовый блок. Отредактируйте его справа.',
               color: '#333333', align: 'left', padding: 16, fontSize: 16 };

    case 'image':
      return { ...base, src: 'https://picsum.photos/800/400',
               alt: 'Изображение', align: 'center', padding: 16, radius: 6 };

    case 'button':
      return { ...base, text: 'Нажми меня', url: '#',
               bg: '#3b82f6', color: '#ffffff',
               align: 'left', padding: 16, radius: 6 };

    case 'divider':
      return { ...base, color: '#dddddd', padding: 12 };

    case 'columns':
      return { ...base, left: 'Левая колонка', right: 'Правая колонка',
               color: '#333333', padding: 16 };

    case 'video':
      return { ...base, url: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
               padding: 16 };

    case 'form':
      return { ...base, emailPlaceholder: 'Ваш email',
               messagePlaceholder: 'Сообщение',
               buttonText: 'Отправить',
               bg: '#3b82f6', color: '#ffffff',
               padding: 16, radius: 6 };

    default:
      return base;
  }
}

// ================================================================
// РЕНДЕР БЛОКА В HTML (для холста и для экспорта)
// ================================================================
function renderBlockHTML(b) {
  const p = b.padding ?? 16;
  switch (b.type) {
    case 'heading':
      return `<h${b.level} style="color:${b.color};text-align:${b.align};margin:0">${escapeHtml(b.text)}</h${b.level}>`;

    case 'text':
      return `<p style="color:${b.color};text-align:${b.align};font-size:${b.fontSize}px;line-height:1.6;margin:0;white-space:pre-wrap">${escapeHtml(b.text)}</p>`;

    case 'image':
      return `<div style="text-align:${b.align}"><img src="${escapeAttr(b.src)}" alt="${escapeAttr(b.alt)}" style="max-width:100%;height:auto;border-radius:${b.radius}px"></div>`;

    case 'button':
      return `<div style="text-align:${b.align}"><a href="${escapeAttr(b.url)}" style="display:inline-block;padding:12px 28px;background:${b.bg};color:${b.color};text-decoration:none;border-radius:${b.radius}px;font-weight:600;font-family:inherit">${escapeHtml(b.text)}</a></div>`;

    case 'divider':
      return `<div style="height:2px;background:${b.color}"></div>`;

    case 'columns':
      return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;color:${b.color}">
        <div>${escapeHtml(b.left)}</div>
        <div>${escapeHtml(b.right)}</div>
      </div>`;

    case 'video':
      return `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:6px">
        <iframe src="${escapeAttr(b.url)}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen></iframe>
      </div>`;

    case 'form':
      return `<form onsubmit="event.preventDefault();alert('Форма отправлена (демо)')">
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:13px;margin-bottom:4px;color:#444">Email</label>
          <input type="email" placeholder="${escapeAttr(b.emailPlaceholder)}" required
            style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;box-sizing:border-box">
        </div>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:13px;margin-bottom:4px;color:#444">Сообщение</label>
          <textarea placeholder="${escapeAttr(b.messagePlaceholder)}" rows="4"
            style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;box-sizing:border-box;resize:vertical"></textarea>
        </div>
        <button type="submit"
          style="padding:12px 28px;background:${b.bg};color:${b.color};border:none;border-radius:${b.radius}px;font-weight:600;cursor:pointer;font-family:inherit">
          ${escapeHtml(b.buttonText)}
        </button>
      </form>`;

    default:
      return '';
  }
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ================================================================
// РЕНДЕР ХОЛСТА
// ================================================================
function renderCanvas() {
  canvas.classList.toggle('empty', blocks.length === 0);
  canvas.innerHTML = '';

  blocks.forEach(b => {
    const wrap = document.createElement('div');
    wrap.className = 'block' + (b.id === selectedId ? ' selected' : '');
    wrap.dataset.id = b.id;
    wrap.style.padding = (b.padding ?? 16) + 'px 24px';

    // drag handle
    const handle = document.createElement('div');
    handle.className = 'drag-handle';
    handle.textContent = '⋮⋮';
    handle.draggable = true;
    handle.addEventListener('dragstart', e => {
      e.dataTransfer.setData('block-id', String(b.id));
      e.dataTransfer.effectAllowed = 'move';
    });
    wrap.appendChild(handle);

    // actions
    const actions = document.createElement('div');
    actions.className = 'block-actions';

    const upBtn = document.createElement('button');
    upBtn.textContent = '↑'; upBtn.title = 'Вверх';
    upBtn.onclick = e => { e.stopPropagation(); moveBlock(b.id, -1); };

    const downBtn = document.createElement('button');
    downBtn.textContent = '↓'; downBtn.title = 'Вниз';
    downBtn.onclick = e => { e.stopPropagation(); moveBlock(b.id, +1); };

    const dupBtn = document.createElement('button');
    dupBtn.textContent = '⎘'; dupBtn.title = 'Дублировать';
    dupBtn.onclick = e => { e.stopPropagation(); duplicateBlock(b.id); };

    const delBtn = document.createElement('button');
    delBtn.className = 'del'; delBtn.textContent = '✕'; delBtn.title = 'Удалить';
    delBtn.onclick = e => { e.stopPropagation(); deleteBlock(b.id); };

    actions.append(upBtn, downBtn, dupBtn, delBtn);
    wrap.appendChild(actions);

    // content
    const content = document.createElement('div');
    content.innerHTML = renderBlockHTML(b);
    wrap.appendChild(content);

    // select
    wrap.addEventListener('click', e => {
      e.stopPropagation();
      selectedId = b.id;
      renderCanvas();
      renderProps();
    });

    canvas.appendChild(wrap);
  });
}

// ================================================================
// ОПЕРАЦИИ С БЛОКАМИ
// ================================================================
function addBlock(type, index = null) {
  const b = createBlock(type);
  if (index === null || index >= blocks.length) blocks.push(b);
  else blocks.splice(index, 0, b);
  selectedId = b.id;
  renderCanvas();
  renderProps();
}

function deleteBlock(id) {
  blocks = blocks.filter(b => b.id !== id);
  if (selectedId === id) selectedId = null;
  renderCanvas();
  renderProps();
}

function duplicateBlock(id) {
  const idx = blocks.findIndex(b => b.id === id);
  if (idx < 0) return;
  const copy = { ...blocks[idx], id: ++blockCounter };
  blocks.splice(idx + 1, 0, copy);
  selectedId = copy.id;
  renderCanvas();
  renderProps();
}

function moveBlock(id, dir) {
  const idx = blocks.findIndex(b => b.id === id);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= blocks.length) return;
  [blocks[idx], blocks[newIdx]] = [blocks[newIdx], blocks[idx]];
  renderCanvas();
}

// ================================================================
// ПАНЕЛЬ СВОЙСТВ
// ================================================================
function renderProps() {
  const b = blocks.find(x => x.id === selectedId);
  props.innerHTML = '';
  props.classList.toggle('empty', !b);
  if (!b) return;

  const addText = (label, key, opts = {}) => {
    const g = document.createElement('div');
    g.className = 'prop-group';
    g.innerHTML = `<label>${label}</label>`;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = b[key] ?? '';
    inp.oninput = () => { b[key] = inp.value; renderCanvas(); };
    g.appendChild(inp);
    props.appendChild(g);
  };

  const addTextarea = (label, key) => {
    const g = document.createElement('div');
    g.className = 'prop-group';
    g.innerHTML = `<label>${label}</label>`;
    const ta = document.createElement('textarea');
    ta.value = b[key] ?? '';
    ta.oninput = () => { b[key] = ta.value; renderCanvas(); };
    g.appendChild(ta);
    props.appendChild(g);
  };

  const addColor = (label, key) => {
    const g = document.createElement('div');
    g.className = 'prop-group';
    g.innerHTML = `<label>${label}</label>`;
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = b[key] ?? '#000000';
    inp.oninput = () => { b[key] = inp.value; renderCanvas(); };
    g.appendChild(inp);
    props.appendChild(g);
  };

  const addNumber = (label, key, min = 0, max = 200) => {
    const g = document.createElement('div');
    g.className = 'prop-group';
    g.innerHTML = `<label>${label}</label>`;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = min; inp.max = max;
    inp.value = b[key] ?? 0;
    inp.oninput = () => { b[key] = Number(inp.value) || 0; renderCanvas(); };
    g.appendChild(inp);
    props.appendChild(g);
  };

  const addSelect = (label, key, options) => {
    const g = document.createElement('div');
    g.className = 'prop-group';
    g.innerHTML = `<label>${label}</label>`;
    const sel = document.createElement('select');
    options.forEach(([val, text]) => {
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = text;
      if (String(b[key]) === String(val)) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = () => { b[key] = sel.value; renderCanvas(); };
    g.appendChild(sel);
    props.appendChild(g);
  };

  const title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = 'Блок: ' + b.type;
  props.appendChild(title);

  // Общие поля
  addNumber('Отступы (px)', 'padding', 0, 100);

  // Специфичные поля
  switch (b.type) {
    case 'heading':
      addText('Текст', 'text');
      addSelect('Уровень', 'level', [['1','H1'],['2','H2'],['3','H3']]);
      addColor('Цвет', 'color');
      addSelect('Выравнивание', 'align', [['left','Слева'],['center','По центру'],['right','Справа']]);
      break;

    case 'text':
      addTextarea('Текст', 'text');
      addColor('Цвет', 'color');
      addNumber('Размер шрифта', 'fontSize', 10, 48);
      addSelect('Выравнивание', 'align', [['left','Слева'],['center','По центру'],['right','Справа']]);
      break;

    case 'image':
      addText('URL картинки', 'src');
      addText('Alt-текст', 'alt');
      addNumber('Радиус', 'radius', 0, 100);
      addSelect('Выравнивание', 'align', [['left','Слева'],['center','По центру'],['right','Справа']]);
      break;

    case 'button':
      addText('Текст кнопки', 'text');
      addText('Ссылка (URL)', 'url');
      addColor('Цвет фона', 'bg');
      addColor('Цвет текста', 'color');
      addNumber('Радиус', 'radius', 0, 40);
      addSelect('Выравнивание', 'align', [['left','Слева'],['center','По центру'],['right','Справа']]);
      break;

    case 'divider':
      addColor('Цвет', 'color');
      break;

    case 'columns':
      addTextarea('Левая колонка', 'left');
      addTextarea('Правая колонка', 'right');
      addColor('Цвет текста', 'color');
      break;

    case 'video':
      addText('URL (embed)', 'url');
      break;

    case 'form':
      addText('Placeholder email', 'emailPlaceholder');
      addText('Placeholder сообщения', 'messagePlaceholder');
      addText('Текст кнопки', 'buttonText');
      addColor('Цвет кнопки', 'bg');
      addColor('Цвет текста кнопки', 'color');
      addNumber('Радиус', 'radius', 0, 40);
      break;
  }

  // Кнопка удаления
  const delBtn = document.createElement('button');
  delBtn.className = 'btn danger';
  delBtn.style.width = '100%';
  delBtn.style.marginTop = '8px';
  delBtn.textContent = '🗑 Удалить блок';
  delBtn.onclick = () => deleteBlock(b.id);
  props.appendChild(delBtn);
}

// ================================================================
// DRAG & DROP: библиотека → холст
// ================================================================
document.querySelectorAll('.block-item').forEach(item => {
  item.addEventListener('dragstart', e => {
    e.dataTransfer.setData('new-block-type', item.dataset.type);
    e.dataTransfer.effectAllowed = 'copy';
  });
});

canvas.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';

  // Подсветка позиции вставки
  const after = getBlockAfterPoint(e.clientX, e.clientY);
  document.querySelectorAll('.block.dragover').forEach(el => el.classList.remove('dragover'));
  if (after) after.classList.add('dragover');
});

canvas.addEventListener('dragleave', () => {
  document.querySelectorAll('.block.dragover').forEach(el => el.classList.remove('dragover'));
});

canvas.addEventListener('drop', e => {
  e.preventDefault();
  document.querySelectorAll('.block.dragover').forEach(el => el.classList.remove('dragover'));

  const newType = e.dataTransfer.getData('new-block-type');
  const movingId = e.dataTransfer.getData('block-id');
  const after = getBlockAfterPoint(e.clientX, e.clientY);
  const afterIdx = after ? blocks.findIndex(b => b.id === Number(after.dataset.id)) : blocks.length;
  const insertAt = after ? afterIdx : blocks.length;

  if (newType) {
    addBlock(newType, insertAt);
  } else if (movingId) {
    const id = Number(movingId);
    const fromIdx = blocks.findIndex(b => b.id === id);
    if (fromIdx < 0) return;
    const [moved] = blocks.splice(fromIdx, 1);
    let target = insertAt;
    if (fromIdx < target) target--;
    blocks.splice(target, 0, moved);
    renderCanvas();
  }
});

// Определяем, ПОСЛЕ какого блока вставить
function getBlockAfterPoint(x, y) {
  const els = [...canvas.querySelectorAll('.block')];
  for (const el of els) {
    const r = el.getBoundingClientRect();
    if (y < r.top + r.height / 2) return el;
  }
  return null;
}

// Клик по пустому холсту — снять выделение
canvas.addEventListener('click', () => {
  selectedId = null;
  renderCanvas();
  renderProps();
});

// ================================================================
// ЭКСПОРТ В HTML
// ================================================================
function buildFullHTML() {
  const body = blocks.map(b => {
    const p = b.padding ?? 16;
    return `  <section style="padding:${p}px 24px">\n    ${renderBlockHTML(b)}\n  </section>`;
  }).join('\n');

  return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой сайт</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #111;
    background: #fff;
    line-height: 1.5;
  }
  section { max-width: 900px; margin: 0 auto; }
  img { max-width: 100%; height: auto; }
  a { color: inherit; }
  @media (max-width: 640px) {
    section { padding-left: 16px !important; padding-right: 16px !important; }
  }
</style>
</head>
<body>
${body || '  <!-- Сайт пуст -->'}
</body>
</html>`;
}

document.getElementById('btnExport').onclick = () => {
  const html = buildFullHTML();
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('HTML-файл скачан');
};

// ================================================================
// ПРЕВЬЮ
// ================================================================
document.getElementById('btnPreview').onclick = () => {
  const html = buildFullHTML();
  const frame = document.getElementById('previewFrame');
  frame.srcdoc = html;
  document.getElementById('modal').classList.add('open');
};

document.getElementById('btnClosePreview').onclick = () => {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('previewFrame').srcdoc = '';
};

// ================================================================
// ОЧИСТКА
// ================================================================
document.getElementById('btnClear').onclick = () => {
  if (blocks.length === 0 || confirm('Удалить все блоки?')) {
    blocks = [];
    selectedId = null;
    renderCanvas();
    renderProps();
  }
};

// ================================================================
// УВЕДОМЛЕНИЕ
// ================================================================
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ================================================================
// СТАРТ
// ================================================================
renderCanvas();
renderProps();
</script>
</body>
</html>
